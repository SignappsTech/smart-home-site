`,`<section id="luc-krmiljenje" data-transition="fade" style="background:#121829;color:#dde5f0;font-family:'Source Sans 3', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px">
<h2 style="font-family:'Plus Jakarta Sans', Arial, sans-serif;font-size:64px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#f4f7fb">Krmiljenje izberemo ob naročilu svetila</h2>
<p style="font-size:26px;line-height:1.45;color:#dde5f0;width:1500px">Isto svetilo je pogosto na voljo v več izvedbah krmiljenja. Od izbire je odvisno, kaj svetilo zmore v pametnem domu. Primer: izvedbe, ki jih navaja LED2.</p>
<table style="font-size:26px;font-family:'Source Sans 3', Arial, sans-serif;border:1px solid #28304a">
<tr style="background:#1b2238"><th style="width:19%;color:#86e9ff;padding:14px 24px">Izvedba</th><th style="width:29%;color:#b8c4d8">Kaj zmore svetilo</th><th style="width:32%;color:#b8c4d8">Kako ga povežemo</th><th style="width:20%;color:#b8c4d8">Pri nas</th></tr>
<tr style="background:#0b1020"><td style="width:19%;color:#f4f7fb">ON/OFF</td><td style="width:29%;color:#dde5f0">vklop in izklop</td><td style="width:32%;color:#dde5f0">rele za stikalom</td><td style="width:20%;color:#3dd6f5">podprto</td></tr><tr style="background:#121829"><td style="width:19%;color:#f4f7fb">DALI/PUSH</td><td style="width:29%;color:#dde5f0">zatemnjevanje</td><td style="width:32%;color:#dde5f0">DALI vmesnik na omrežju</td><td style="width:20%;color:#3dd6f5">z vmesnikom</td></tr><tr style="background:#0b1020"><td style="width:19%;color:#f4f7fb">DALI TW</td><td style="width:29%;color:#dde5f0">svetlost in barva, 2700–6500 K</td><td style="width:32%;color:#dde5f0">DALI vmesnik na omrežju</td><td style="width:20%;color:#3dd6f5">z vmesnikom</td></tr><tr style="background:#121829"><td style="width:19%;color:#f4f7fb">CASAMBI TW</td><td style="width:29%;color:#dde5f0">svetlost in barva svetlobe</td><td style="width:32%;color:#dde5f0">Bluetooth ali pretvornik v DALI</td><td style="width:20%;color:#86e9ff">preizkus na vzorcu</td></tr><tr style="background:#0b1020"><td style="width:19%;color:#f4f7fb">ZIGBEE TW</td><td style="width:29%;color:#dde5f0">svetlost in barva svetlobe</td><td style="width:32%;color:#dde5f0">neposredno v Zigbee omrežje doma</td><td style="width:20%;color:#86e9ff">preizkus na vzorcu</td></tr>
</table>
<p style="font-size:30px;line-height:1.45;color:#f4f7fb;width:1500px">Zato se vključimo že pri specifikaciji: ob načrtu svetil pripravimo še načrt krmiljenja in prizorov.</p>

`,`<section id="luc-povezave" data-transition="fade" style="background:#0b1020;color:#dde5f0;font-family:'Source Sans 3', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:36px">
<h2 style="font-family:'Plus Jakarta Sans', Arial, sans-serif;font-size:64px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#f4f7fb">Povezava z DALI in Casambi</h2>
<p style="font-size:28px;line-height:1.45;color:#dde5f0;width:1500px">Svetila s profesionalnim krmiljenjem vključimo v isti sistem kot senčila, ogrevanje in prizore doma.</p>
<div style="display:flex;gap:32px">
<div style="flex:1;display:flex;flex-direction:column;gap:20px;background:#1b2238;border:1px solid #28304a;border-radius:24px;padding:40px"><h3 style="font-family:'Plus Jakarta Sans', Arial, sans-serif;font-size:44px;font-weight:700;color:#f4f7fb;line-height:1.15">DALI</h3><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Žična povezava za vgradna svetila in večje projekte.</p><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Vsako svetilo ali skupino krmilimo posebej: svetlost in, pri DT8, barvo svetlobe.</p><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Povezava prek DALI vmesnika na omrežju, na primer Lunatone DALI-2 IoT ali Sunricher SR-GW-EDA.</p></div>
<div style="flex:1;display:flex;flex-direction:column;gap:20px;background:#1b2238;border:1px solid #28304a;border-radius:24px;padding:40px"><h3 style="font-family:'Plus Jakarta Sans', Arial, sans-serif;font-size:44px;font-weight:700;color:#f4f7fb;line-height:1.15">Casambi</h3><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Brezžična povezava (Bluetooth), primerna tudi tam, kjer ni novih kablov.</p><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Svetila, stikala in senzorji Casambi ostanejo, kot so.</p><p style="font-size:28px;line-height:1.45;color:#dde5f0;padding:16px 0 0;border-top:1px solid #28304a">Povezava prek Bluetootha ali s pretvornikom Casambi–DALI (CBU-DCS). Pred izvedbo jo preizkusimo.</p></div>
